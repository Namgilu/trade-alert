name: Korean market 08:55 preopen alert

on:
  workflow_dispatch:

env:
  NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
  NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
  JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
  JEV_API_URL: ${{ vars.JEV_API_URL || 'https://api.typesafe.ai/v1/systemone' }}
  JEV_MODEL: ${{ vars.JEV_MODEL || 'jev-latest' }}
  DART_API_KEY: ${{ secrets.DART_API_KEY }}
  KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
  KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
  KIS_BASE_URL: ${{ vars.KIS_BASE_URL || 'https://openapi.koreainvestment.com:9443' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

permissions:
  contents: write

jobs:
  preopen:
    runs-on: ubuntu-latest
    environment: action-env
    timeout-minutes: 15
    concurrency:
      group: trade-alert-data-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check out accumulated theme data
        id: theme-data
        uses: actions/checkout@v4
        with:
          ref: data
          path: .theme-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: market-date
        run: echo "value=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
      - id: candidate-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/candidates.json
          key: trade-alert-candidates-v3-${{ steps.market-date.outputs.value }}
      - run: python -m pip install .
      - name: Analyze and notify
        env:
          MARKET_DATE: ${{ steps.market-date.outputs.value }}
        run: trade-alert --mode preopen --candidate-file .cache/candidates.json --report-file ".theme-data/reports/${MARKET_DATE}/preopen.json"
      - if: always() && steps.candidate-cache.outputs.cache-hit != 'true' && hashFiles('.cache/candidates.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/candidates.json
          key: trade-alert-candidates-v3-${{ steps.market-date.outputs.value }}
      - name: Commit web report
        if: always() && steps.theme-data.outcome == 'success'
        working-directory: .theme-data
        env:
          REPORT_PATH: reports/${{ steps.market-date.outputs.value }}/preopen.json
        run: |
          if [ ! -f "$REPORT_PATH" ]; then
            echo "No report generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT_PATH" reports/index.json
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "report: save ${REPORT_PATH}"
            git push origin HEAD:data
          fi
