name: Korean market three-stage alert

on:
  schedule:
    # 07:30 Asia/Seoul, Monday-Friday (UTC Sunday-Thursday)
    - cron: "30 22 * * 0-4"
    # 08:55 Asia/Seoul, Monday-Friday (UTC Sunday-Thursday)
    - cron: "55 23 * * 0-4"
    # 09:10 Asia/Seoul, Monday-Friday
    - cron: "10 0 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: Alert stage to run
        required: true
        default: premarket
        type: choice
        options:
          - premarket
          - preopen
          - confirmation

env:
  NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
  NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
  JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
  JEV_API_URL: ${{ vars.JEV_API_URL || 'https://api.typesafe.ai/v1/systemone' }}
  JEV_MODEL: ${{ vars.JEV_MODEL || 'jev-latest' }}
  DART_API_KEY: ${{ secrets.DART_API_KEY }}
  KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
  KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
  KIWOOM_BASE_URL: ${{ vars.KIWOOM_BASE_URL || 'https://api.kiwoom.com' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  premarket:
    if: github.event.schedule == '30 22 * * 0-4' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'premarket')
    runs-on: ubuntu-latest
    environment: action-env
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: trade-alert --mode premarket

  preopen:
    if: github.event.schedule == '55 23 * * 0-4' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'preopen')
    runs-on: ubuntu-latest
    environment: action-env
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: trade-alert --mode preopen

  confirmation:
    if: github.event.schedule == '10 0 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'confirmation')
    runs-on: ubuntu-latest
    environment: action-env
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: trade-alert --mode confirmation
