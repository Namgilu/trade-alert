name: Korean market three-stage alert

on:
  schedule:
    # 07:30 Asia/Seoul, Monday-Friday (UTC Sunday-Thursday)
    - cron: "30 22 * * 0-4"
    # 08:55 Asia/Seoul, Monday-Friday (UTC Sunday-Thursday)
    - cron: "55 23 * * 0-4"
    # 09:10 Asia/Seoul, Monday-Friday
    - cron: "10 0 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: Alert stage to run
        required: true
        default: premarket
        type: choice
        options:
          - premarket
          - preopen
          - confirmation

env:
  NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
  NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
  JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
  JEV_API_URL: ${{ vars.JEV_API_URL || 'https://api.typesafe.ai/v1/systemone' }}
  JEV_MODEL: ${{ vars.JEV_MODEL || 'jev-latest' }}
  DART_API_KEY: ${{ secrets.DART_API_KEY }}
  KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
  KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
  KIS_BASE_URL: ${{ vars.KIS_BASE_URL || 'https://openapi.koreainvestment.com:9443' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  premarket:
    if: github.event.schedule == '30 22 * * 0-4' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'premarket')
    runs-on: ubuntu-latest
    environment: action-env
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: market-date
        run: echo "value=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
      - run: python -m pip install .
      - run: trade-alert --mode premarket --candidate-file .cache/candidates.json
      - if: always() && hashFiles('.cache/candidates.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/candidates.json
          key: trade-alert-candidates-${{ steps.market-date.outputs.value }}

  preopen:
    if: github.event.schedule == '55 23 * * 0-4' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'preopen')
    runs-on: ubuntu-latest
    environment: action-env
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: market-date
        run: echo "value=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
      - id: candidate-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/candidates.json
          key: trade-alert-candidates-${{ steps.market-date.outputs.value }}
      - run: python -m pip install .
      - run: trade-alert --mode preopen --candidate-file .cache/candidates.json
      - if: always() && steps.candidate-cache.outputs.cache-hit != 'true' && hashFiles('.cache/candidates.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/candidates.json
          key: trade-alert-candidates-${{ steps.market-date.outputs.value }}

  confirmation:
    if: github.event.schedule == '10 0 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'confirmation')
    runs-on: ubuntu-latest
    environment: action-env
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: market-date
        run: echo "value=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
      - id: candidate-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/candidates.json
          key: trade-alert-candidates-${{ steps.market-date.outputs.value }}
      - run: python -m pip install .
      - run: trade-alert --mode confirmation --candidate-file .cache/candidates.json
      - if: always() && steps.candidate-cache.outputs.cache-hit != 'true' && hashFiles('.cache/candidates.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/candidates.json
          key: trade-alert-candidates-${{ steps.market-date.outputs.value }}
