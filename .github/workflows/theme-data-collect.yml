name: Korean market 16:10 theme data collection

on:
  schedule:
    # 16:10 Asia/Seoul, Monday-Friday
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
    inputs:
      market_date:
        description: 'Expected live trading date (YYYY-MM-DD); no historical backfill'
        required: false
        type: string

env:
  NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
  NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
  JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
  JEV_API_URL: ${{ vars.JEV_API_URL || 'https://api.typesafe.ai/v1/systemone' }}
  JEV_MODEL: ${{ vars.JEV_MODEL || 'jev-latest' }}
  DART_API_KEY: ${{ secrets.DART_API_KEY }}
  KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
  KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
  KIS_BASE_URL: ${{ vars.KIS_BASE_URL || 'https://openapi.koreainvestment.com:9443' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: action-env
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: trade-alert-data-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Check out accumulated theme data
        uses: actions/checkout@v5
        with:
          ref: data
          path: .theme-data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Collect verified trading session
        env:
          REQUESTED_DATE: ${{ inputs.market_date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # created_at stays fixed across reruns; refuse to relabel current live
          # data as an old scheduled run after the next session has completed.
          ANCHOR=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)
          export COLLECTION_ANCHOR="$ANCHOR"
          args=()
          if [ -n "$REQUESTED_DATE" ]; then args+=(--market-date "$REQUESTED_DATE"); fi
          trade-alert --mode collect --history-repository .theme-data "${args[@]}"
      - name: Commit accumulated theme data
        working-directory: .theme-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog daily memberships state
          if git diff --cached --quiet; then
            echo "No theme data changes"
          else
            git commit -m "data: collect verified trading session (run ${GITHUB_RUN_ID})"
            git push origin HEAD:data
          fi
