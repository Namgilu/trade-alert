name: Korean market 16:10 theme data collection

on:
  schedule:
    # 16:10 Asia/Seoul, Monday-Friday
    - cron: "10 7 * * 1-5"
  workflow_dispatch:

env:
  NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
  NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
  JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
  JEV_API_URL: ${{ vars.JEV_API_URL || 'https://api.typesafe.ai/v1/systemone' }}
  JEV_MODEL: ${{ vars.JEV_MODEL || 'jev-latest' }}
  DART_API_KEY: ${{ secrets.DART_API_KEY }}
  KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
  KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
  KIS_BASE_URL: ${{ vars.KIS_BASE_URL || 'https://openapi.koreainvestment.com:9443' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: action-env
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: theme-history-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check out accumulated theme data
        uses: actions/checkout@v4
        with:
          ref: data
          path: .theme-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: market-date
        run: echo "value=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore same-day bootstrap handoff
        uses: actions/cache/restore@v4
        with:
          path: .theme-data/state/theme-history.json
          key: trade-alert-history-handoff-v1-${{ steps.market-date.outputs.value }}
      - run: python -m pip install .
      - run: trade-alert --mode collect --history-repository .theme-data
      - name: Commit accumulated theme data
        working-directory: .theme-data
        env:
          MARKET_DATE: ${{ steps.market-date.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog daily memberships state
          if git diff --cached --quiet; then
            echo "No theme data changes"
          else
            git commit -m "data: collect ${MARKET_DATE}"
            git push origin HEAD:data
          fi
