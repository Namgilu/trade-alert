[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morning-theme-alert"
version = "0.1.0"
description = "Korean stock theme, news sentiment, and Telegram morning alert"
requires-python = ">=3.11"

[project.scripts]
trade-alert = "trade_alert.cli:main"
trade-alert-web = "trade_alert.webapp:main"

[project.optional-dependencies]
server = [
  "APScheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[tool.setuptools.package-data]
trade_alert = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]
